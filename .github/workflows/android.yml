name: Android

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.invalid --verbose 2>&1 | tee /tmp/android-build.log
      - name: Upload Android build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: /tmp/android-build.log
          if-no-files-found: error
      - name: Publish Android build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ANDROID_BUILD_LOG: /tmp/android-build.log
        with:
          script: |
            const fs = require('fs');
            const path = process.env.ANDROID_BUILD_LOG;
            const log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Build log was not created.';
            const tail = log.slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Android build diagnostics',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Android build log tail',
                summary: `\`\`\`text\n${tail}\n\`\`\``
              }
            });
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: price-analyst-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
