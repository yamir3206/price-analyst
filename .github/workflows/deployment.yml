name: Deployment

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment configuration
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose.yml config
      - name: Build and start deployment
        run: docker compose -f deploy/docker-compose.yml up --build -d
      - name: Smoke test web and API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/tmp/health.json \
              && curl --fail --silent http://127.0.0.1:8080/ >/tmp/index.html; then
              grep -q 'Price Analyst' /tmp/index.html
              grep -q '"status":"ok"' /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop deployment
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
